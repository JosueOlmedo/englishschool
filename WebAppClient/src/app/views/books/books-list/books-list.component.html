<div class="container-fluid p-0">
  <div class="row align-items-center mb-3 g-2">
    <div class="col-12 col-md-6 text-md-end">
      <button class="btn btn-primary mt-2 mt-md-0" (click)="addBook.emit()">
        <i class="bi bi-plus"></i> Agregar libro
      </button>
    </div>
  </div>
  <!-- Filtro debajo del botón -->
  <div class="row mb-3">
    <div class="col-12 col-md-6">
      <input
        type="text"
        class="form-control"
        placeholder="Buscar libro..."
        [(ngModel)]="searchTerm"
        (input)="filterBooks()"
      />
    </div>
  </div>
  <div class="table-responsive" style="min-height:320px; max-height:60vh; overflow-x:auto;">
    <div style="min-width:700px; max-width:100%; height:320px; overflow-y:auto;">
      <table class="table table-striped table-bordered align-middle mb-0" style="table-layout:fixed; width:100%;">
        <thead class="table-light">
          <tr>
            <th style="width:25%;">Título</th>
            <th style="width:50%;">Descripción</th>
            <th style="width:25%;">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let book of filteredBooks">
            <td class="text-truncate" [title]="book.name">
              {{ book.name.length > 100 ? (book.name | slice:0:100) + '...' : book.name }}
            </td>
            <td class="text-truncate" [title]="book.description">
              {{ book.description.length > 200 ? (book.description | slice:0:200) + '...' : book.description }}
            </td>
            <td>
              <button class="btn btn-link p-0 me-2" (click)="goToUnits.emit(book.bookId)">
                <i class="bi bi-list-ul"></i> Unidades
              </button>
              <button class="btn btn-link p-0" (click)="editBook.emit(book.bookId)">
                <i class="bi bi-pencil"></i> Editar
              </button>
            </td>
          </tr>
          <tr *ngIf="filteredBooks.length === 0">
            <td colspan="3" class="text-center text-muted" style="height:200px; vertical-align:middle;">
              No se encontraron libros.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
